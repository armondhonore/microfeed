application:
  name: microfeed
  pods:
  - name: app
    image: "# filled by pipeline"
    path: /
    servicePorts:
    - 3000
    vars:
      NODE_ENV: production
      SITE_URL: "https://relaxed-weasel-microfeed.cloud.nexlayer.ai"
    volumes:
    - name: microfeed-data
      mountPath: /app/data
      size: 5Gi
